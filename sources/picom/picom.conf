# Switch to GLX but strip it of all "smart" features that cause Strix hangs
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

# Disabling damage is the #1 fix for the "Black Window" bug on 890M
use-damage = false;

# VSync must stay false if TearFree is on in xorg.conf
vsync = false;

# Transparent windows often trigger the scheduler bug; 
# ensure these are off if stability is the priority
fading = false;
shadow = false;
